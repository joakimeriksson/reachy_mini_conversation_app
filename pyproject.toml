[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_local_assistant"
version = "0.4.2"
authors = [{ name = "Pollen Robotics", email = "contact@pollen-robotics.com" }]
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    #Media
    "aiortc>=1.13.0",
    "fastrtc>=0.0.34",
    "gradio==5.50.1.dev1",
    "huggingface-hub==1.3.0",
    "pillow",  # JPEG encode for the camera tool (cv2-free, robot-safe)

    #Environment variables
    "python-dotenv",

    #Local backend: Ollama (Gemma audio LLM/STT) + Piper TTS
    "ollama>=0.4",
    "piper-tts>=1.2",
    "onnxruntime>=1.20",
    "webrtcvad-wheels>=2.0.14",  # maintained fork; plain webrtcvad needs removed pkg_resources on py3.12
    "soundfile>=0.12",
    "httpx",  # remote TTS + MCP token fetch
    "fastmcp>=2.8",  # MCP client (core — external tool servers)

    #Reachy mini
    "reachy_mini_dances_library",
    "reachy_mini_toolbox",
    "reachy-mini>=1.6.0",
]

[project.optional-dependencies]
# Head-tracking backends (aiming the head at faces). Camera *vision* is handled
# by the multimodal LLM (Gemma) — no separate vision model.
yolo_vision = [
  "ultralytics",
  "supervision",
]
mediapipe_vision = [
  "mediapipe==0.10.14",
]
all_vision = [
  "ultralytics",
  "supervision",
  "mediapipe==0.10.14",
]
# Standalone "fake robot" voice runner (scripts/local_chat.py, outside src/ so it
# never ships in the wheel): talk to the Ollama+Piper pipeline via the computer's
# mic/speaker/webcam, no robot. Robot audio/camera go through `robot.media` instead.
localdev = [
  "sounddevice",
  "opencv-python>=4.12.0.88",  # dev-only: --local-webcam fallback (NOT shipped to the robot)
]
# Self-hosted OpenAI-compatible voice server (scripts/voice_server.py). Piper engine
# works with the core piper-tts; for the Kokoro engine also `pip install kokoro`.
voiceserver = [
  "fastapi",
  "uvicorn",
]
# Acoustic echo cancellation for barge-in on open speakers (WebRTC APM via livekit).
aec = [
  "livekit",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff==0.12.0",
  "mypy==1.18.2",
  "pre-commit",
  "types-requests",
  "python-semantic-release>=10.5.3",
]

[project.scripts]
reachy-local-assistant = "reachy_local_assistant.main:main"

[tool.uv]
dependency-metadata = [
    # Upstream metadata currently marks `gstreamer-msvc-runtime` as unconditional.
    # It should only be required on Windows. Temp fix. Version unpinned so the
    # override applies to any gstreamer-libs release (e.g. 1.28.2).
    { name = "gstreamer-libs", requires-dist = ["gstreamer-msvc-runtime; sys_platform == 'win32'", "setuptools"] },
]

[project.entry-points."reachy_mini_apps"]
reachy_local_assistant = "reachy_local_assistant.main:ReachyLocalAssistant"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reachy_local_assistant = [
  "images/*",
  "static/*",
  ".env.example",
  "demos/**/*.txt",
  "prompts_library/*.txt",
  "prompts/**/*.txt",
]
reachy_local_data = [
  "profiles/**/*.txt",
  "profiles/**/*.py",
]

[tool.ruff]
line-length = 119
exclude = [".venv", "dist", "build", "**/__pycache__", "*.egg-info", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
]
ignore = [
  "E501",  # handled by formatter
  "D100",  # ignore missing module docstrings
  "D203",  # blank line before class docstring (conflicts with D211)
  "D213",  # summary on second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]            # docstrings on every test/helper are noise
"scripts/**" = ["D", "E402"]  # dev scripts; sys.path bootstrap precedes imports

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
no-lines-before = ["standard-library", "local-folder"]
known-local-folder = ["reachy_local_assistant"]
known-first-party = ["reachy_mini", "reachy_mini_dances_library", "reachy_mini_toolbox"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src/"]
ignore_missing_imports = true
strict = true
show_error_codes = true
warn_unused_ignores = true
